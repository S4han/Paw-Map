[project]
name = "pawmap-ingest"
version = "0.1.0"
description = "PAW MAP 데이터 가공 파이프라인(관광공사·식약처 → 시도별 데이터셋)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pawmap-ingest = "pawmap_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pawmap_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
